name: terminal
services:
  client:
    container_name: terminal.client
    restart: always
    depends_on:
      server:
        condition: service_healthy

  server:
    container_name: terminal.server
    restart: always
    environment:
      - ASPNETCORE_URLS=${ASPNETCORE_URLS}
      - Jwt__Issuer=${Jwt__Issuer}
      - Jwt__Audience=${Jwt__Audience}
      - Jwt__SecretKey=${Jwt__SecretKey}
      - Jwt__AccessTokenExpirationMinutes=${Jwt__AccessTokenExpirationMinutes}
      - Jwt__RefreshTokenExpirationDays=${Jwt__RefreshTokenExpirationDays}
      - Postgres__ConnectionString=${Postgres__ConnectionString}
      - Administrator__Email=${Administrator__Email}
      - Administrator__Password=${Administrator__Password}

      # --- OpenTelemetry (Ustandaryzowane nazwy) ---
      - OTEL_EXPORTER_OTLP_PROTOCOL=${OTEL_EXPORTER_OTLP_PROTOCOL}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS}
      - OTEL_RESOURCE_ATTRIBUTES=${OTEL_RESOURCE_ATTRIBUTES}
      - OTEL_SERVICE_NAME=terminal-backend

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5006/api/ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:17-bookworm
    container_name: terminal.postgres
    restart: always
    pull_policy: missing
    volumes:
      - terminalData:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 1s
      timeout: 5s
      retries: 5

  backup:
    container_name: terminal.backup
    restart: "no"
    volumes:
      - ${RESTIC_HOST_SSH_KEY_PATH}:/auth/id_rsa:ro
      - ${RESTIC_HOST_GDRIVE_KEY_PATH}:/auth/gdrive-sa.json:ro
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - RESTIC_PASSWORD=${RESTIC_PASSWORD}
      - RESTIC_SFTP_HOST=${RESTIC_SFTP_HOST}
      - RESTIC_SFTP_USER=${RESTIC_SFTP_USER}
      - RESTIC_SFTP_PORT=${RESTIC_SFTP_PORT}
      - RESTIC_SFTP_REPO_PATH=${RESTIC_SFTP_REPO_PATH}
      - RESTIC_GDRIVE_RCLONE_REMOTE=${RESTIC_GDRIVE_RCLONE_REMOTE}
      - RESTIC_GDRIVE_REPO_PATH=${RESTIC_GDRIVE_REPO_PATH}
      - RCLONE_CONFIG_GDRIVE_TYPE=drive
      - RCLONE_CONFIG_GDRIVE_SCOPE=drive
      - RCLONE_CONFIG_GDRIVE_SERVICE_ACCOUNT_FILE=/auth/gdrive-sa.json
    depends_on:
      database:
        condition: service_healthy 

volumes:
  terminalData:

on:
  workflow_call:
    inputs:
      app-dir:
        required: false
        type: string
        default: /home/terminal_user
    secrets:
      ssh-private-key: { required: true }
      ansible-user: { required: true }
      deployment-targets: { required: true }
      otel-endpoint: { required: true }
      otel-headers: { required: true }
      otel-attributes: { required: true }
      registry-token: { required: true }
      JWT_SECRET_KEY: { required: true }
      ADMIN_EMAIL: { required: true }
      ADMIN_PASSWORD: { required: true }
      POSTGRES_USER: { required: true }
      POSTGRES_PASSWORD: { required: true }
      RESTIC_PASSWORD: { required: true }
      RESTIC_GDRIVE_FOLDER_ID: { required: true }
      GDRIVE_SERVICE_ACCOUNT_JSON_B64: { required: true }
      BACKUP_SFTP_HOST: { required: true }
      BACKUP_SFTP_USER: { required: true }
      BACKUP_SFTP_REPO_PATH: { required: true }
      BACKUP_SFTP_PRIVATE_KEY_B64: { required: true }

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          echo "${{ secrets.ssh-private-key }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Create Ansible inventory
        id: make-inventory
        uses: ./.github/actions/make-inventory
        with:
          host-list: ${{ secrets.deployment-targets }}
          group-name: web

      - name: Install Ansible
        run: |
          python3 -m pip install --user ansible-core
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run Ansible Playbook
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          IMAGE_NAME="oci://ghcr.io/$(echo $REPO_OWNER | tr '[:upper:]' '[:lower:]')/terminal/compose:latest"
          
          ansible-playbook -i inventory.ini ansible/deploy-playbook.yml \
            --extra-vars "{
              \"compose_image\": \"$IMAGE_NAME\",
              \"deployment_dir\": \"${{ inputs.app-dir }}\",
              \"registry_token\": \"${{ secrets.registry-token }}\",
              \"github_user\": \"${{ github.actor }}\",
              \"otel_endpoint\": \"${{ secrets.otel-endpoint }}\",
              \"otel_headers\": \"${{ secrets.otel-headers }}\",
              \"otel_attributes\": \"${{ secrets.otel-attributes }}\",
              \"jwt_secret\": \"${{ secrets.JWT_SECRET_KEY }}\",
              \"admin_email\": \"${{ secrets.ADMIN_EMAIL }}\",
              \"admin_password\": \"${{ secrets.ADMIN_PASSWORD }}\",
              \"postgres_user\": \"${{ secrets.POSTGRES_USER }}\",
              \"postgres_pass\": \"${{ secrets.POSTGRES_PASSWORD }}\",
              \"restic_password\": \"${{ secrets.RESTIC_PASSWORD }}\",
              \"restic_gdrive_folder_id\": \"${{ secrets.RESTIC_GDRIVE_FOLDER_ID }}\",
              \"gdrive_service_account_json_b64\": \"${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON_B64 }}\",
              \"backup_sftp_host\": \"${{ secrets.BACKUP_SFTP_HOST }}\",
              \"backup_sftp_user\": \"${{ secrets.BACKUP_SFTP_USER }}\",
              \"backup_sftp_repo_path\": \"${{ secrets.BACKUP_SFTP_REPO_PATH }}\",
              \"backup_sftp_private_key_b64\": \"${{ secrets.BACKUP_SFTP_PRIVATE_KEY_B64 }}\"
            }" \
            --private-key private_key.pem -u ${{ secrets.ansible-user }}
      - name: Cleanup
        if: always()
        run: rm -f private_key.pem
